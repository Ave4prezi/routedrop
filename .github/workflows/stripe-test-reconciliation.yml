name: RouteDrop Stripe test-mode reconciliation
on:
  push:
    branches:
      - test/real-stripe-reconciliation-20261110
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-and-mocked:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: localonly
          POSTGRES_DB: routedrop_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d routedrop_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: routedrop-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax and full simulated booking
        env:
          ROUTEDROP_TEST_DATABASE_URL: postgres://postgres:localonly@localhost:5432/routedrop_ci
        run: |
          node --check test/stripe-real-test-reconciliation.test.js
          node --test test/deferred-payment-lifecycle-http.test.js
      - name: Check real-Stripe test opts out safely without secrets
        run: node --test test/stripe-real-test-reconciliation.test.js
  real-stripe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: routedrop-stripe-test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: localonly
          POSTGRES_DB: routedrop_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d routedrop_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: routedrop-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate strict test-only settings
        env:
          TEST_KEY: ${{ secrets.ROUTEDROP_STRIPE_TEST_KEY }}
          CONNECTED: ${{ vars.ROUTEDROP_TEST_PROVIDER_ACCOUNT_ID }}
          PLATFORM: ${{ vars.ROUTEDROP_STRIPE_TEST_PLATFORM_ID }}
        run: |
          if [[ "$TEST_KEY" != sk_test_* ]]; then
            echo 'A Stripe TEST secret key must be configured in the protected routedrop-stripe-test environment.'
            exit 1
          fi
          if [[ "$CONNECTED" != acct_* || "$PLATFORM" != acct_* ]]; then
            echo 'Configure both the expected platform and provider TEST account IDs as environment variables.'
            exit 1
          fi
      - name: Real Stripe test charge with signed webhook replay
        env:
          ROUTEDROP_REAL_STRIPE_E2E: 'true'
          ROUTEDROP_TEST_DATABASE_URL: postgres://postgres:localonly@localhost:5432/routedrop_ci
          ROUTEDROP_STRIPE_TEST_KEY: ${{ secrets.ROUTEDROP_STRIPE_TEST_KEY }}
          ROUTEDROP_TEST_PROVIDER_ACCOUNT_ID: ${{ vars.ROUTEDROP_TEST_PROVIDER_ACCOUNT_ID }}
          ROUTEDROP_STRIPE_TEST_PLATFORM_ID: ${{ vars.ROUTEDROP_STRIPE_TEST_PLATFORM_ID }}
          ROUTEDROP_LIVE_APPROVED: 'false'
        run: node --test test/stripe-real-test-reconciliation.test.js
