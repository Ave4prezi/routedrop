name: RouteDrop deferred booking checks

on:
  push:
    branches:
      - feature/book-free-pay-after-service
  pull_request:
    branches:
      - routedrop-platform-beta

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: localonly
          POSTGRES_DB: routedrop_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d routedrop_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: routedrop-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without deployment hooks
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax checks
        run: |
          node --check server.js
          node --check post-service.js
          node --check staging-access.js
          node --check public/app.js
      - name: All Node.js and disposable PostgreSQL tests
        env:
          ROUTEDROP_TEST_DATABASE_URL: postgres://postgres:localonly@localhost:5432/routedrop_ci
        run: npm test
