name: RouteDrop service radius desktop and mobile walkthrough
on:
  push:
    branches: [feature/business-service-radius-20261115]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app and browser without install hooks
        working-directory: routedrop-platform
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --ignore-scripts --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise true beta Business Studio radius UI without live data or payments
        run: node routedrop-platform/test/service-area-browser.mjs
      - name: Upload visual screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: routedrop-radius-business-studio
          path: radius-*.png
          if-no-files-found: ignore
          retention-days: 7
