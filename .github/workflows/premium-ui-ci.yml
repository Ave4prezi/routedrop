name: RouteDrop premium UI integration checks
on:
  push:
    branches:
      - feature/premium-ui-integration-20261109
      - feature/premium-functional-beta-20261109
  pull_request:
    branches:
      - feature/stripe-payafter-isolated-sandbox-20261107
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: localonly
          POSTGRES_DB: routedrop_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d routedrop_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: routedrop-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --check public/app.js
      - run: node --test test/premium-ui-integration.test.js
      - env:
          ROUTEDROP_TEST_DATABASE_URL: postgres://postgres:localonly@localhost:5432/routedrop_ci
        run: npm test
