name: RouteDrop fictional support privacy and security triage tests
on:
  push:
    branches:
      - test/provider-synthetic-support-triage-20261115
permissions:
  contents: read
jobs:
  support-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: disposableonly
          POSTGRES_DB: routedrop_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d routedrop_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: routedrop-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate restricted support, server and browser code
        run: |
          node --check preview-support.js
          node --check server.js
          node --check public/app.js
          node --check test/preview-support.test.js
          node --check test/provider-preview-ack-http.test.js
      - name: Exercise real HTTP app with disposable Postgres and invented users
        env:
          ROUTEDROP_TEST_DATABASE_URL: postgres://postgres:disposableonly@127.0.0.1:5432/routedrop_ci
        run: |
          node --test test/preview-support.test.js test/operator-access.test.js test/provider-expiry.test.js test/provider-preview-ack-http.test.js test/founding-partner-http.test.js test/provider-verification.test.js
      - name: Refuse operator changes outside approved fictional environment
        run: |
          if node scripts/manage-preview-operator.js grant admin@ci.invalid reviewer@ci.invalid support_reviewer 2027-01-01T00:00:00Z "Unauthorized external role assignment"; then
            exit 1
          fi
