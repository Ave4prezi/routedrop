name: Payment reference validation
on:
  push:
    branches: [fix/prelaunch-payment-reconciliation-20261125]
  pull_request:
    paths:
      - 'routedrop-platform/**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: routedrop-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: node --check post-service.js
      - run: node --test payment-reference.test.js
      - run: npm audit --omit=dev --audit-level=high
